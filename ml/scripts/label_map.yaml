# ScamGuard Narrative Classification — Taxonomy & Source Label Mapping
# Schema: maps external dataset topics and keywords to ScamGuard categories.
#
# ScamGuard Target Categories:
#   1: War in Ukraine and Russia justification
#   2: Anti-EU / "Europe is falling apart"
#   3: Anti-NATO / anti-West
#   4: Moldova government and elections delegitimisation
#   5: Russophobia, language and identity
#   6: Sanctions, energy prices and economy fear
#   7: Transnistria / Gagauzia and separatism
#   8: Health, vaccines and conspiracy
#   9: Traditional values, religion, anti-LGBT narratives
#  10: Other / not disinformation (Benign)
#  11: Financial panic, bank runs and currency devaluation (Hard / Low-Resource)
#  12: Forced mobilization and border militarization (Hard / Low-Resource)
#  13: Other disinformation (Disinformation outside primary 11 narratives)

version: "1.0"
taxonomy:
  1:
    name: "War in Ukraine and Russia justification"
    severity: "high"
    description: "Pro-Kremlin war justifications, framing Ukraine as aggressor, denazification narratives, Donbas defense."
  2:
    name: "Anti-EU / 'Europe is falling apart'"
    severity: "high"
    description: "Narratives alleging European disintegration, loss of national sovereignty to Brussels, EU economic ruin, migrant crisis."
  3:
    name: "Anti-NATO / anti-West"
    severity: "high"
    description: "Western warmongering, NATO encircling or preparing military aggression, US hegemony and puppet regimes."
  4:
    name: "Moldova government and elections delegitimisation"
    severity: "high"
    description: "Chisinau leadership delegitimisation, fraudulent elections, diaspora voting rigging, Western puppet state claims."
  5:
    name: "Russophobia, language and identity"
    severity: "medium"
    description: "Allegations of anti-Russian discrimination, persecution of Russian speakers, erasure of Soviet/Russian heritage."
  6:
    name: "Sanctions, energy prices and economy fear"
    severity: "high"
    description: "Economic catastrophe blamed on anti-Russian sanctions, gas shutoffs, freezing in winter, agricultural collapse."
  7:
    name: "Transnistria / Gagauzia and separatism"
    severity: "high"
    description: "Claims of military escalation against Transnistria, oppression of Gagauzia autonomy, Chisinau provocations."
  8:
    name: "Health, vaccines and conspiracy"
    severity: "medium"
    description: "Secret biological laboratories, weaponized pathogens, vaccine microchipping, global depopulation theories."
  9:
    name: "Traditional values, religion, anti-LGBT narratives"
    severity: "medium"
    description: "Moral decay, Western imposition of LGBT agendas, destruction of Orthodox Christian family values."
  10:
    name: "Other / not disinformation"
    severity: "low"
    description: "Benign civic news, local sports, weather, transport schedules, cultural events, neutral institutional announcements."
  11:
    name: "Financial panic, bank runs and currency devaluation"
    severity: "high"
    description: "Fabricated rumors of bank insolvency, ATM cash freezes, national currency devaluation, banking system collapse."
  12:
    name: "Forced mobilization and border militarization"
    severity: "high"
    description: "Fabricated mobilization orders for Moldovan reservists, closed borders, Romanian troop integration rumors."
  13:
    name: "Other disinformation"
    severity: "medium"
    description: "Verified disinformation or propaganda cases that do not map to the 11 core Moldovan security narratives."

