services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scamguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scamguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scamguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scamguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scamguard} -d ${POSTGRES_DB:-scamguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamguard-backend
    restart: unless-stopped
    env_file:
      - .env.example
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scamguard-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
